name: Update Docs & Screenshots

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [ "main" ]

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v3

    - name: Ensure Docs Directory Exists
      run: mkdir -p docs

    - name: Inject Mock Screenshots to README
      run: |
        echo "Updating README with standard screenshot paths..."
        sed -i 's|<!-- SCREENSHOT_PLACEHOLDER -->|<img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/settings.png" width="400"/>\n<img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/proposals.png" width="400"/>|g' README.md

    - name: Include Screenshots in PR Body
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const prBody = `
          ## UI Previews
          <img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.pull_request.head.sha}/docs/settings.png" width="400"/>
          <img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.pull_request.head.sha}/docs/proposals.png" width="400"/>
          `;
          github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: context.payload.pull_request.body + '\n\n' + prBody
          });

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "docs: Auto-update screenshots in README"
