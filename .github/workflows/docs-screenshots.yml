name: Update Docs & Screenshots

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [ "main" ]

jobs:
  generate-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: |
        dotnet restore ScaniFly/ScaniFly.csproj
        dotnet restore ScaniFly.UITests/ScaniFly.UITests.csproj

    - name: Install Playwright Browsers
      run: |
        dotnet tool install --global Microsoft.Playwright.CLI
        playwright install chromium

    - name: Build App
      run: dotnet build ScaniFly/ScaniFly.csproj -c Release

    - name: Run App in Background
      run: dotnet run --project ScaniFly/ScaniFly.csproj -c Release --urls "http://localhost:5000" &
      env:
        ASPNETCORE_ENVIRONMENT: Development

    - name: Wait for App to Start
      run: sleep 10

    - name: Run UI Tests to Capture Screenshots
      run: dotnet test ScaniFly.UITests/ScaniFly.UITests.csproj -c Release

    - name: Ensure Docs Directory Exists
      run: mkdir -p docs

    - name: Inject Mock Screenshots to README
      run: |
        echo "Updating README with standard screenshot paths..."
        sed -i 's|<!-- SCREENSHOT_PLACEHOLDER -->|<img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/settings.png" width="400"/>\n<img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/proposals.png" width="400"/>|g' README.md

    - name: Include Screenshots in PR Body
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const prBody = `
          ## UI Previews
          <img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.pull_request.head.sha}/docs/settings.png" width="400"/>
          <img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.pull_request.head.sha}/docs/proposals.png" width="400"/>
          `;
          github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: context.payload.pull_request.body + '\n\n' + prBody
          });

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "docs: Auto-update screenshots in README and docs folder"
