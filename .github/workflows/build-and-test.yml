name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ScaniFly/ScaniFly.csproj
    - name: Build
      run: dotnet build ScaniFly/ScaniFly.csproj --no-restore --configuration Release
    - name: Test
      run: dotnet test ScaniFly.Tests/ScaniFly.Tests.csproj --no-build --verbosity normal --configuration Release
